[project]
name = "arrive-aml"
version = "0.1.0"
description = "Azure ML development environment setup"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
arriveds = [
    "arriveds",
    "snowflake>=1.12.1",
]

[tool.uv]
# This repo is an environment definition (scripts + notebooks), not an installable package.
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arriveds = { git = "ssh://git@github.com/rarko-arrive/arrive-ds.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
