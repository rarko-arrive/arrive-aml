[project]
name = "arriveds"
version = "0.1.0"
description = "Arrive DS Cursor demo — uv package with Snowflake utils"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "snowflake>=1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hello = "arriveds.hello:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arriveds"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
