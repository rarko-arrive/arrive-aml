# Team repositories set up on every VM by scripts/setup-repos.sh
# Format: REPO|NAME|AUTO_MIRROR
#   REPO         {org}/name (org = ARRIVE_GITHUB_ORG, default in scripts/lib/common.sh),
#                owner/name, or a full git URL. ssh vs https is picked automatically.
#   NAME         folder name (default: the repo name)
#   AUTO_MIRROR  yes/no - create the fast /mnt/mirror clone + venv (default: yes)
#
# Personal repos go in ~/.config/arrive-aml/repos.conf (same format), or run:
#   bash scripts/setup-repos.sh --add owner/name

{org}/arrive-aml|arrive-aml|yes
{org}/azureml-skills|azureml-skills|yes
{org}/arrive-ds|arrive-ds|yes
